[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-media-abs-bridge"
version = "0.1.0"
description = "Audiobookshelf integration for agent-media's book channel."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["agent-media-core"]

[project.scripts]
media-abs-book-bridge  = "agent_media_abs.book_bridge:main"
media-abs-cast-watcher = "agent_media_abs.cast_watcher:main"
media-abs-cast         = "agent_media_abs.cast_watcher:cast_main"
media-abs-sync         = "agent_media_abs.sync:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_media_abs"]
